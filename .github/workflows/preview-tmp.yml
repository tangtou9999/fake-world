name: Build ios-pass-2 preview (one-off)

on:
  push:
    branches: [preview-tmp]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moments-notes
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @fake-world/web exec tsc --noEmit
      - run: pnpm -F @fake-world/web exec tsc --noEmit
      - run: pnpm -F @fake-world/web exec vite build
      - name: Publish dist to preview-build branch
        run: |
          cd packages/web/dist
          touch .nojekyll
          git init -q -b preview-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview build of ios-pass-2"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin preview-build
